<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube PiP Subtitles</title>
    <style>
      body {
        font-family: Roboto, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        background: #0f0f0f;
        color: #f1f1f1;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3ea6ff;
        display: inline-block;
      }
      .status {
        font-size: 12px;
        color: #aaa;
        margin: 0 0 10px;
        min-height: 16px;
      }
      #openBtn {
        width: 100%;
        padding: 10px;
        background: #3ea6ff;
        color: #0f0f0f;
        font-weight: 700;
        border: 0;
        border-radius: 18px;
        cursor: pointer;
        font-size: 13px;
      }
      #openBtn:hover { background: #65b8ff; }
      #openBtn:disabled { opacity: 0.5; cursor: default; }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-size: 12px;
      }
      input[type='range'] { width: 130px; }
      kbd {
        color: #3ea6ff;
        background: #212121;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
        font-family: inherit;
      }
      .footer {
        margin-top: 14px;
        font-size: 11px;
        color: #777;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> YouTube PiP Subtitles</h1>
    <p class="status" id="status">Ready</p>
    <button id="openBtn">Open PiP window</button>
    <div class="row">
      <label for="fs">Font size</label>
      <input type="range" id="fs" min="10" max="40" value="18" />
    </div>
    <div class="row">
      <label for="bg">Subtitle background</label>
      <input type="checkbox" id="bg" checked />
    </div>
    <div class="footer">
      Shortcut: <kbd>Ctrl+Shift+P</kbd> (<kbd>⌘+Shift+P</kbd> on Mac)
    </div>
    <script src="popup.js"></script>
  </body>
</html>
